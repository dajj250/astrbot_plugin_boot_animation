<div id="dsh-startup-root" class="dsu-root dsu-boot"></div>
<script>
(function () {
  var c = {}; try { c = parent.__ASTRBOT_BOOT_ANIMATION__ || {}; } catch (_) {}
  window.__DSH_STARTUP_SCRIPT_URL__ = './splash.js';
  window.__DSH_STARTUP__ = {
    enabled:true, mode:'always', revision:'1.1.2', theme:c.codeAnimationTheme==='dark'?'dark':'light',

    requireInteraction:c.codeAnimationInteractive===true, allowSkip:true,

    voiceSource:'asset', recordedVoiceOnly:true, sfx:'audio',

    accent:'#6479d4', glitchA:'#b97ac6', glitchB:'#6aadd4'

  document.documentElement.classList.add('dsu-lock');

    parent.postMessage({type:'astrbot-code-animation:done'},location.origin);
  },{once:true});
})();
</script>
