<html lang="zh-CN"><head>

<link rel="stylesheet" href="../code-animation-gemini/gemini.css">
</head><body>
<div id="dsh-startup-root" class="dsu-root dsu-boot"></div>
<script>
(function () {
  var c = {}; try { c = parent.__ASTRBOT_BOOT_ANIMATION__ || {}; } catch (_) {}
  window.__DSH_STARTUP_SCRIPT_URL__ = './splash.js';
  window.__DSH_STARTUP__ = {
    enabled:true, mode:'always', revision:'1.1.5', theme:c.codeAnimationTheme==='dark'?'dark':'light',
    speed:Number(c.codeAnimationSpeed)||1,
    requireInteraction:c.codeAnimationInteractive===true, allowSkip:true,
    sound:c.codeAnimationSound===true, voice:c.codeAnimationSound===true,
    voiceSource:'asset', recordedVoiceOnly:true, sfx:'audio',
    identity:'ASTRBOT', identityId:'0003', accessLevel:'3',
    brand1:'GEMINI STYLE', brand2:'AI VISUAL THEME · UNOFFICIAL', brand3a:'AGENT', brand3b:'OS',
    orgZh:'Gemini 风格', orgEn:'GEMINI STYLE', orgSub:'INDEPENDENT FAN THEME · ASTRBOT',
    welcomeBox:'GEMINI STYLE', footer:'GEMINI STYLE · ASTRBOT · UNOFFICIAL',
    logoUrl:'../code-animation-gemini/gemini-star.svg', logoAlt:'Gemini 四角星',
    logoLabel:'G E M I N I  S T Y L E', welcomeLogoLabel:'G E M I N I  S T Y L E  ·  A S T R B O T',
    welcomeAsset:'line-6-gemini',
    accent:'#6479d4', glitchA:'#b97ac6', glitchB:'#6aadd4'
  };
  document.documentElement.classList.add('dsu-lock');
  window.addEventListener('dsh-startup:done',function(){
    parent.postMessage({type:'astrbot-code-animation:done'},location.origin);
  },{once:true});
})();
</script>
<script defer src="./splash.js"></script>
<script defer src="../code-animation-gemini/stars.js"></script>
</body></html>
