<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AstrBot 代码启动动画</title>
  <link rel="stylesheet" href="./splash.css">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608}
  </style>
</head>
<body>
  <div id="dsh-startup-root" class="dsu-root dsu-boot"></div>
  <script>
    (function () {
      var parentConfig = {};
      try { parentConfig = parent.__ASTRBOT_BOOT_ANIMATION__ || {}; } catch (_) {}
      window.__DSH_STARTUP_SCRIPT_URL__ = './splash.js';
      window.__DSH_STARTUP__ = {
        enabled: true,
        mode: 'always',
        theme: parentConfig.codeAnimationTheme === 'dark' ? 'dark' : 'light',
        speed: Number(parentConfig.codeAnimationSpeed) || 1,
        requireInteraction: parentConfig.codeAnimationInteractive === true,
        allowSkip: true,
        sound: parentConfig.codeAnimationSound === true,
        voice: parentConfig.codeAnimationSound === true,
        voiceSource: 'asset',
        sfx: 'audio',
        identity: 'ASTRBOT',
        identityId: '0001',
        accessLevel: '3',
        brand1: 'ASTRBOT',
        brand2: 'AGENTIC INTELLIGENCE',
        brand3a: 'AGENT',
        brand3b: 'OS',
        orgZh: 'ASTRBOT',
        orgEn: 'ASTRBOT',
        orgSub: 'AGENTIC ASSISTANT',
        welcomeBox: 'ASTRBOT',
        footer: 'POWERED BY ASTRBOT',
        accent: '#ff7500',
        glitchA: '#ff3b30',
        glitchB: '#2971b8'
      };
      document.documentElement.classList.add('dsu-lock');
      window.addEventListener('dsh-startup:done', function () {
        parent.postMessage({ type: 'astrbot-code-animation:done' }, location.origin);
      }, { once: true });
    })();
  </script>
  <script defer src="./splash.js"></script>
</body>
</html>
